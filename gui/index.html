<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consensus</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66;
  --line: #e3e1db; --accent: #3b5bdb; --accent-ink: #ffffff;
  --ok: #2b8a3e; --warn: #b8590b; --bad: #c92a2a; --run: #1971c2;
  --code: #f1efe9; --claude: #c4622d; --codex: #1c7c6c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --panel: #1f1f1d; --ink: #ecebe7; --muted: #9c9a94;
    --line: #34332f; --accent: #748ffc; --accent-ink: #111;
    --ok: #69db7c; --warn: #ffa94d; --bad: #ff6b6b; --run: #4dabf7;
    --code: #2a2a27; --claude: #e8916a; --codex: #4fc4ae;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
header { display: flex; align-items: center; gap: 16px; padding: 12px 20px;
  border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 17px; margin: 0; font-weight: 650; }
.env { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.pill { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
.pill.bad { color: var(--bad); border-color: var(--bad); }
.layout { display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - 53px); }
aside { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
aside .new { margin: 14px; width: calc(100% - 28px); }
.run-item { padding: 10px 14px; border-top: 1px solid var(--line); cursor: pointer; }
.run-item:hover { background: var(--code); }
.run-item.sel { background: var(--code); box-shadow: inset 3px 0 var(--accent); }
.run-item .t { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.run-item .m { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
main { overflow-y: auto; padding: 24px clamp(16px, 4vw, 48px); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 20px; max-width: 920px; }
label { display: block; font-weight: 550; margin: 14px 0 6px; }
.hint { font-weight: 400; color: var(--muted); font-size: 13px; }
textarea, input[type=number], select {
  width: 100%; font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 7px; padding: 9px 11px; }
textarea { min-height: 180px; resize: vertical; }
textarea:focus, input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.models { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 4px; }
.side { border: 1px solid var(--line); border-radius: 8px; padding: 4px 14px 14px; }
.side h3 { margin: 10px 0 0; font-size: 14px; }
.side.claude h3 { color: var(--claude); } .side.codex h3 { color: var(--codex); }
.pick { display: grid; grid-template-columns: 1fr 110px; gap: 8px; }
.pick label { margin: 8px 0 4px; font-size: 13px; }
input[type=text] { width: 100%; font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 7px; padding: 9px 11px; }
.reset { font-size: 12.5px; color: var(--accent); cursor: pointer; margin-left: 8px; font-weight: 400; }
.row label { margin-top: 14px; }
.check { display: flex; gap: 8px; align-items: center; font-weight: 400; margin-top: 52px; }
button { font: inherit; border-radius: 7px; border: 1px solid var(--line); background: var(--panel);
  color: var(--ink); padding: 7px 14px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.danger { color: var(--bad); border-color: var(--bad); }
button:disabled { opacity: .5; cursor: default; }
.drop { border: 1.5px dashed var(--line); border-radius: 8px; padding: 14px; text-align: center;
  color: var(--muted); cursor: pointer; }
.drop.over { border-color: var(--accent); color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { background: var(--code); border-radius: 6px; padding: 3px 8px; font-size: 13px; }
.chip button { border: 0; padding: 0 0 0 6px; background: none; color: var(--muted); }
.chip a { color: var(--accent); margin-left: 6px; cursor: pointer; }
.chip.busy { color: var(--run); } .chip.failed { color: var(--bad); }
.spin { display: inline-block; width: 9px; height: 9px; margin-right: 5px; border-radius: 50%;
  border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.actions { display: flex; gap: 12px; align-items: center; margin-top: 18px; flex-wrap: wrap; }
.err { color: var(--bad); font-size: 14px; }
.note { color: var(--muted); font-size: 13px; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .03em; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.s-running { color: var(--run); } .s-running .dot { animation: pulse 1.4s infinite; }
.s-consensus { color: var(--ok); } .s-no-consensus { color: var(--warn); }
.s-failed { color: var(--bad); } .s-interrupted, .s-ended { color: var(--muted); }
.s-proof { color: var(--ok); }
.modes { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 3px; margin-bottom: 14px; }
.modes button { border: 0; border-radius: 6px; padding: 6px 14px; background: none; color: var(--muted); }
.modes button.on { background: var(--code); color: var(--ink); font-weight: 600; }
.form.m-debate .proof-only, .form.m-proof .debate-only { display: none; }
.writer { display: grid; grid-template-columns: 140px 1fr 110px; gap: 8px; }
.writer label { margin: 8px 0 4px; font-size: 13px; }
.kindtag { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em;
  border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--muted); }
.copy { margin-left: auto; font-size: 12.5px; padding: 3px 10px; }
@keyframes pulse { 50% { opacity: .25; } }
.runhead { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.runhead h2 { margin: 0 0 6px; font-size: 19px; }
.meta { color: var(--muted); font-size: 13px; }
.tabs { display: flex; gap: 4px; margin: 18px 0 0; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none;
  color: var(--muted); padding: 8px 12px; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.pane { padding-top: 16px; }
pre.log { background: var(--code); border-radius: 8px; padding: 14px; font-size: 12.5px;
  white-space: pre-wrap; word-break: break-word; max-height: 70vh; overflow-y: auto; margin: 0; }
.md h1 { font-size: 20px; } .md h2 { font-size: 16.5px; margin-top: 26px;
  padding-top: 14px; border-top: 1px solid var(--line); }
.md h2.claude { color: var(--claude); } .md h2.codex { color: var(--codex); }
.md code { background: var(--code); padding: 1px 4px; border-radius: 4px; font-size: 13px; }
.md pre { background: var(--code); padding: 12px; border-radius: 8px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md .verdict { font-weight: 700; } .md .agree { color: var(--ok); } .md .disagree { color: var(--warn); }
.md .cp { color: var(--muted); font-size: 13px; border-left: 3px solid var(--line); padding-left: 10px; }
 .stack { display: grid; gap: 16px; max-width: 980px; }
.stack .card { max-width: none; }
.cfggrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.cfgside { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.cfgside span { display: block; font-family: -apple-system, system-ui, sans-serif; font-weight: 650; font-size: 13px; }
.cfgside.claude span { color: var(--claude); } .cfgside.codex span { color: var(--codex); }
.cfgside em { font-style: normal; color: var(--muted); margin-left: 8px; }
.question { margin-top: 10px; } .qtext { white-space: pre-wrap; margin-top: 6px; padding: 10px 12px; background: var(--code); border-radius: 8px; font-size: 14px; }
.livehead { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.livehead h3 { margin: 0; font-size: 16px; }
.toggle { display: inline-flex; gap: 5px; align-items: center; margin: 0; font-weight: 400; font-size: 13px; color: var(--muted); }
.livehead .toggle:first-of-type { margin-left: auto; }
.feed { margin-top: 12px; max-height: 72vh; overflow-y: auto; padding-right: 6px; }
.scrollbox { max-height: 72vh; overflow-y: auto; }
.entry { border-left: 3px solid var(--line); padding: 2px 0 2px 12px; margin: 0; }
.entry.w-claude { border-left-color: var(--claude); } .entry.w-codex { border-left-color: var(--codex); }
.entry.k-call { margin-top: 18px; } .feed .entry.k-call:first-child { margin-top: 0; }
.callhead { display: flex; gap: 10px; align-items: baseline; }
.whotag { font-weight: 700; } .callhead.claude .whotag { color: var(--claude); } .callhead.codex .whotag { color: var(--codex); }
.entry .md > :first-child { margin-top: 4px; } .entry .md > :last-child { margin-bottom: 4px; }
.think summary, .tool summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.thinktext { white-space: pre-wrap; color: var(--muted); font-size: 13px; font-style: italic; max-height: 260px; overflow-y: auto; }
.tool summary { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toolname { color: var(--ink); font-weight: 600; }
.tool.bad .toolname { color: var(--bad); }
.tool pre { background: var(--code); border-radius: 6px; padding: 8px 10px; font-size: 12px; white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow-y: auto; margin: 4px 0; }
.statusline { font-size: 13px; color: var(--ok); } .statusline.bad { color: var(--bad); }
.feed.no-thinking .k-thinking, .feed.no-tools .k-tool { display: none; }
.feed.running .entry.k-text:last-child .md > :last-child::after { content: "▍"; color: var(--muted); animation: pulse 1s infinite; }
.outcome.o-consensus { color: var(--ok); }
.verdict-box { margin-top: 10px; border: 1px solid var(--ok); border-radius: 8px; padding: 4px 16px 8px; max-height: 60vh; overflow-y: auto; }
.verdict-label { font-size: 12.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .03em; color: var(--ok); margin-top: 10px; }
.verdict-box .md h1, .verdict-box .md h2, .verdict-box .md h3 { font-size: 15px; border-top: 0; padding-top: 0; margin: 14px 0 4px; }
.outcome { margin-top: 14px; padding: 10px 14px; border-radius: 8px; background: var(--code); font-weight: 600; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; height: auto; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 260px; }
  .row { grid-template-columns: 1fr 1fr; }
  .models, .cfggrid, .writer { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header>
  <h1>Consensus</h1>
  <div class="env" id="env"></div>
</header>
<div class="layout">
  <aside>
    <button class="primary new" id="newBtn">New run</button>
    <div id="runs"></div>
  </aside>
  <main id="main"></main>
</div>

<template id="formTpl">
  <div class="card form m-debate" id="form">
    <div class="modes" id="modes">
      <button data-mode="debate" class="on">Review / debate</button>
      <button data-mode="proof">Construct a proof</button>
    </div>
    <div class="debate-only">
      <h2 style="margin:0 0 4px;font-size:19px">New debate</h2>
      <div class="note">Claude and Codex debate the question until two reports in a row agree, they stall, or the round limit is reached.</div>
    </div>
    <div class="proof-only">
      <h2 style="margin:0 0 4px;font-size:19px">New proof</h2>
      <div class="note">One model writes a new proof using the proof-craft skill: an explanatory, rigorous proof for a paper, or a counterexample if the claim is false. <span id="skillNote"></span></div>
    </div>
    <label for="q"><span class="debate-only">Question <span class="hint">— state the question, the standard of proof, and the answer format you want</span></span><span class="proof-only">Statement <span class="hint">— the claim to prove, the intended reader, and the definitions or results you may assume</span></span></label>
    <textarea id="q" placeholder="e.g. Is the proof of Lemma 3 in the attached paper correct? Check each step…"></textarea>
    <label>Context files <span class="hint">— <span class="debate-only">included in every turn</span><span class="proof-only">reference material for the writer</span>; Claude transcribes PDFs to text first</span></label>
    <div class="drop" id="drop">Drop text or PDF files here, or click to choose<input type="file" id="files" multiple hidden></div>
    <div class="chips" id="chips"></div>
    <div class="proof-only">
      <label>Writer <span class="hint">— proof-craft works with either model; type any model ID</span><a class="reset" id="resetWriter">reset to defaults</a></label>
      <div class="writer">
        <div><label for="pWriter">Model family</label><select id="pWriter"><option value="claude">Claude</option><option value="codex">Codex</option></select></div>
        <div><label for="pModel">Model</label><input type="text" id="pModel" list="cModels" spellcheck="false" autocomplete="off"></div>
        <div><label for="pEffort">Effort</label><select id="pEffort"></select></div>
      </div>
    </div>
    <div class="debate-only">
    <label>Debaters <span class="hint">— model and effort for each side; type any model ID</span><a class="reset" id="resetModels">reset to defaults</a></label>
    <div class="models">
      <div class="side claude"><h3>Claude</h3><div class="pick">
        <div><label for="cModel">Model</label><input type="text" id="cModel" list="cModels" spellcheck="false" autocomplete="off"></div>
        <div><label for="cEffort">Effort</label><select id="cEffort"></select></div></div></div>
      <div class="side codex"><h3>Codex</h3><div class="pick">
        <div><label for="xModel">Model</label><input type="text" id="xModel" list="xModels" spellcheck="false" autocomplete="off"></div>
        <div><label for="xEffort">Effort</label><select id="xEffort"></select></div></div></div>
    </div>
    <datalist id="cModels"></datalist><datalist id="xModels"></datalist>
    <div class="row">
      <div><label for="rounds">Max rounds</label><input type="number" id="rounds" min="1" max="50" value="6"></div>
      <div><label for="first">First speaker</label>
        <select id="first"><option value="claude">Claude</option><option value="codex">Codex</option></select></div>
      <div><label for="subs">Sub-agents <span class="hint">per side</span></label><input type="number" id="subs" min="0" max="16" value="0"></div>
      <div><label class="check"><input type="checkbox" id="synth" checked> Final synthesis</label></div>
    </div>
    <label class="check" style="margin-top:14px"><input type="checkbox" id="lit"> Literature evidence <span class="hint" id="litHint">— in the opening round, one sub-agent per side may check one claim against the literature with the Paperclip Evidence API (the claim is sent to Paperclip)</span></label>
    </div>
    <div class="actions">
      <button class="primary" id="start">Start debate</button>
      <span class="note debate-only">Starts a live debate using your Claude and Codex accounts (usage counts against both). Shortcut: ⌘/Ctrl + Enter.</span>
      <span class="note proof-only">Starts one call on the chosen model's account. Shortcut: ⌘/Ctrl + Enter.</span>
      <span class="err" id="formErr"></span>
    </div>
  </div>
</template>

<script>
"use strict";
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LABEL = {running: "Running", consensus: "Consensus", "no-consensus": "No consensus",
  failed: "Failed", interrupted: "Stopped", ended: "Ended", proof: "Proof ready"};

let runs = [], selected = null, tab = "transcript", contexts = [], draft = null;
let detailTimer = null, env = null, mode = "debate";
const MODEL_KEY = "consensus-gui-models", WRITER_KEY = "consensus-gui-writer", MODE_KEY = "consensus-gui-mode";
function stored(key) { try { return JSON.parse(localStorage.getItem(key) || "null"); } catch (e) { return null; } }
function store(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }

async function api(path, body) {
  const opts = {headers: {"X-Consensus-Token": TOKEN}};
  if (body !== undefined) {
    opts.method = "POST"; opts.body = JSON.stringify(body);
    opts.headers["Content-Type"] = "application/json";
  }
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

function statusHtml(state) {
  return `<span class="status s-${state}"><span class="dot"></span>${LABEL[state] || state}</span>`;
}
function when(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, {month: "short", day: "numeric"}) + " " +
    d.toLocaleTimeString(undefined, {hour: "2-digit", minute: "2-digit"});
}
function duration(run) {
  const end = run.ended ? new Date(run.ended) : new Date();
  const s = Math.max(0, Math.round((end - new Date(run.created)) / 1000));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h}h ${m}m` : m ? `${m}m ${s % 60}s` : `${s}s`;
}

// ---- environment + run list ---------------------------------------------
async function refreshState() {
  let st;
  try { st = await api("/api/state"); } catch (e) { $("#env").innerHTML = `<span class="pill bad">${esc(e.message)}</span>`; return; }
  const pills = [];
  for (const [cli, ok] of Object.entries(st.clis))
    if (!ok) pills.push(`<span class="pill bad">${cli} CLI not found</span>`);
  env = st;
  if ($("#cModel") && !$("#cModel").value) fillModels();
  if ($("#pModel") && !$("#pModel").value) fillWriter();
  syncLiterature();
  renderSkillNote();
  const m = st.models;
  if (m && m.error) pills.push(`<span class="pill bad">models: ${esc(m.error)}</span>`);
  else if (m) pills.push(`<span class="pill">Default Claude ${esc(m.claude.model)} · ${esc(m.claude.effort)}</span>`,
                         `<span class="pill">Default Codex ${esc(m.openai.model)} · ${esc(m.openai.effort)}</span>`);
  $("#env").innerHTML = pills.join("");
  runs = st.runs;
  $("#runs").innerHTML = runs.length ? runs.map(r => `
    <div class="run-item ${r.id === selected ? "sel" : ""}" data-id="${r.id}">
      <div class="t">${esc(r.title)}</div>
      <div class="m">${statusHtml(r.state)}<span>${when(r.created)}</span>${r.kind === "proof" ? `<span class="kindtag">proof</span>` : ""}</div>
    </div>`).join("") : `<div class="empty">No runs yet</div>`;
  if (!m) setTimeout(refreshState, 1500);
}
$("#runs").addEventListener("click", e => {
  const item = e.target.closest(".run-item");
  if (item) select(item.dataset.id);
});

// ---- debater models ---------------------------------------------------------
function defaultModels() {
  const m = env && env.models && !env.models.error ? env.models : null;
  return m ? {cModel: m.claude.model, cEffort: m.claude.effort, xModel: m.openai.model, xEffort: m.openai.effort} : null;
}
function effortsFor(side, model) {
  const c = env.choices[side];
  const hit = c.models.find(x => x.model === model);
  return hit ? hit.efforts : c.efforts;
}
function setEfforts(sel, efforts, value) {
  const list = efforts.includes(value) || !value ? efforts : [...efforts, value];
  sel.innerHTML = list.map(e => `<option value="${esc(e)}">${esc(e)}</option>`).join("");
  sel.value = value && list.includes(value) ? value : list[list.length - 1];
}
function fillModels(values) {
  const defs = defaultModels(); if (!defs || !$("#cModel")) return;
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(MODEL_KEY) || "null"); } catch (e) {}
  const v = values || (draft && draft.models) || saved || defs;
  const names = side => [...new Set([defs[side === "claude" ? "cModel" : "xModel"], ...env.choices[side].models.map(x => x.model)])];
  $("#cModels").innerHTML = names("claude").map(n => `<option value="${esc(n)}">`).join("");
  $("#xModels").innerHTML = names("codex").map(n => `<option value="${esc(n)}">`).join("");
  $("#cModel").value = v.cModel; $("#xModel").value = v.xModel;
  setEfforts($("#cEffort"), effortsFor("claude", v.cModel), v.cEffort);
  setEfforts($("#xEffort"), effortsFor("codex", v.xModel), v.xEffort);
}
function syncLiterature() {
  const box = $("#lit"); if (!box) return;
  const noKey = env && env.paperclip_key === false, noSubs = !(+$("#subs").value >= 1);
  box.disabled = noKey || noSubs;
  if (box.disabled) box.checked = false;
  $("#litHint").textContent = noKey ? "— needs PAPERCLIP_API_KEY in the environment that started the GUI"
    : noSubs ? "— needs at least one sub-agent per side; only sub-agents may search"
    : "— in the opening round, one sub-agent per side may check one claim against the literature with the Paperclip Evidence API (the claim is sent to Paperclip)";
}
function currentModels() {
  return {cModel: $("#cModel").value.trim(), cEffort: $("#cEffort").value,
          xModel: $("#xModel").value.trim(), xEffort: $("#xEffort").value};
}

// ---- proof writer -------------------------------------------------------------
function defaultWriter(writer) {
  const d = defaultModels(); if (!d) return null;
  return writer === "codex" ? {writer, model: d.xModel, effort: d.xEffort}
                            : {writer: "claude", model: d.cModel, effort: d.cEffort};
}
function fillWriter(values) {
  if (!$("#pModel") || !defaultModels()) return;
  const v = values || (draft && draft.writer) || stored(WRITER_KEY) || defaultWriter("claude");
  const side = v.writer === "codex" ? "codex" : "claude";
  $("#pWriter").value = side;
  $("#pModel").setAttribute("list", side === "codex" ? "xModels" : "cModels");
  $("#pModel").value = v.model;
  setEfforts($("#pEffort"), effortsFor(side, v.model), v.effort);
}
function currentWriter() {
  return {writer: $("#pWriter").value, model: $("#pModel").value.trim(), effort: $("#pEffort").value};
}
function renderSkillNote() {
  const note = $("#skillNote"); if (!note || !env) return;
  note.innerHTML = env.proof_craft
    ? `Using <code>${esc(env.proof_craft)}</code>.`
    : `<span class="err">proof-craft was not found. Link it at <code>~/.claude/skills/proof-craft</code> or start the GUI with <code>--proof-craft PATH</code>.</span>`;
}
function setMode(m) {
  mode = m === "proof" ? "proof" : "debate";
  const form = $("#form"); if (!form) return;
  form.classList.toggle("m-proof", mode === "proof");
  form.classList.toggle("m-debate", mode === "debate");
  $("#modes").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.mode === mode));
  $("#start").textContent = mode === "proof" ? "Construct proof" : "Start debate";
  $("#q").placeholder = mode === "proof"
    ? "e.g. Prove that for every odd integer n, n² − 1 is divisible by 8. The reader knows basic modular arithmetic."
    : "e.g. Is the proof of Lemma 3 in the attached paper correct? Check each step…";
  store(MODE_KEY, mode);
}

// ---- new debate form ------------------------------------------------------
function showForm() {
  selected = null; clearTimeout(detailTimer);
  history.replaceState(null, "", location.search);
  document.querySelectorAll(".run-item.sel").forEach(el => el.classList.remove("sel"));
  const main = $("#main");
  main.innerHTML = "";
  main.appendChild($("#formTpl").content.cloneNode(true));
  if (draft) { $("#q").value = draft.q; $("#rounds").value = draft.rounds; $("#first").value = draft.first;
               $("#subs").value = draft.subs; $("#synth").checked = draft.synth; $("#lit").checked = !!draft.lit; }
  $("#subs").addEventListener("input", syncLiterature);
  syncLiterature();
  setMode(draft ? draft.mode : stored(MODE_KEY));
  $("#modes").querySelectorAll("button").forEach(b => b.onclick = () => { setMode(b.dataset.mode); saveDraft(); });
  renderChips();
  fillModels();
  fillWriter();
  renderSkillNote();
  $("#pWriter").onchange = () => { fillWriter(defaultWriter($("#pWriter").value)); saveDraft(); };
  $("#pModel").onchange = () => setEfforts($("#pEffort"), effortsFor($("#pWriter").value, $("#pModel").value.trim()), $("#pEffort").value);
  $("#resetWriter").onclick = () => { fillWriter(defaultWriter($("#pWriter").value)); saveDraft(); };
  $("#cModel").onchange = () => setEfforts($("#cEffort"), effortsFor("claude", $("#cModel").value.trim()), $("#cEffort").value);
  $("#xModel").onchange = () => setEfforts($("#xEffort"), effortsFor("codex", $("#xModel").value.trim()), $("#xEffort").value);
  $("#resetModels").onclick = () => { fillModels(defaultModels()); saveDraft(); };
  const drop = $("#drop"), input = $("#files");
  drop.onclick = () => input.click();
  input.onchange = () => { addFiles(input.files); input.value = ""; };
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); addFiles(e.dataTransfer.files); };
  main.oninput = saveDraft;
  $("#start").onclick = startRun;
  $("#q").onkeydown = e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) startRun(); };
  $("#q").focus();
}
function saveDraft() {
  if (!$("#q")) return;
  draft = {q: $("#q").value, rounds: $("#rounds").value, first: $("#first").value,
           subs: $("#subs").value, synth: $("#synth").checked, lit: $("#lit").checked, mode,
           models: $("#cModel").value ? currentModels() : null,
           writer: $("#pModel").value ? currentWriter() : null};
}
async function addFiles(list) {
  const err = $("#formErr"); err.textContent = "";
  for (const f of list) {
    if (/\.pdf$/i.test(f.name) || f.type === "application/pdf") { convertPdf(f); continue; }
    const text = await f.text();
    if (text.includes("\u0000")) { err.textContent = `${f.name} looks binary; use text or PDF files.`; continue; }
    contexts.push({name: f.name, text, state: "ready"});
  }
  renderChips();
}
async function convertPdf(file) {
  const item = {name: file.name, source: file.name, state: "converting", parts: 0};
  contexts.push(item); renderChips();
  try {
    const bytes = new Uint8Array(await file.arrayBuffer());
    let bin = "";
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    const job = await api("/api/convert", {name: file.name, data: btoa(bin)});
    item.job = job.id; item.name = job.name;
    pollConversion(item);
  } catch (e) { item.state = "failed"; item.error = e.message; renderChips(); }
}
async function pollConversion(item) {
  if (!contexts.includes(item)) return;
  try {
    const st = await api(`/api/convert/${item.job}`);
    item.parts = st.parts;
    if (st.state === "done") { item.state = "ready"; item.text = st.text; }
    else if (st.state === "failed") { item.state = "failed"; item.error = st.error; }
  } catch (e) { item.state = "failed"; item.error = e.message; }
  renderChips();
  if (item.state === "converting") setTimeout(() => pollConversion(item), 2000);
}
function viewText(item) {
  const url = URL.createObjectURL(new Blob([item.text], {type: "text/plain;charset=utf-8"}));
  window.open(url, "_blank");
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
function renderChips() {
  const el = $("#chips"); if (!el) return;
  el.innerHTML = contexts.map((c, i) => {
    const from = c.source ? `${esc(c.source)} → ` : "";
    if (c.state === "converting")
      return `<span class="chip busy"><span class="spin"></span>${esc(c.source)} — Claude is transcribing${c.parts ? ` (${c.parts} part${c.parts > 1 ? "s" : ""} done)` : "…"}<button data-i="${i}" title="Cancel">✕</button></span>`;
    if (c.state === "failed")
      return `<span class="chip failed" title="${esc(c.error)}">${esc(c.source || c.name)} — conversion failed: ${esc((c.error || "").slice(0, 160))}<button data-i="${i}" title="Remove">✕</button></span>`;
    return `<span class="chip">${from}${esc(c.name)} · ${(c.text.length / 1024).toFixed(1)} KB${c.source ? `<a data-view="${i}">view</a>` : ""}<button data-i="${i}" title="Remove">✕</button></span>`;
  }).join("");
  el.querySelectorAll("button").forEach(b => b.onclick = () => {
    const [item] = contexts.splice(+b.dataset.i, 1);
    if (item.state === "converting" && item.job) api(`/api/convert/${item.job}/cancel`, {}).catch(() => {});
    renderChips();
  });
  el.querySelectorAll("a[data-view]").forEach(a => a.onclick = () => viewText(contexts[+a.dataset.view]));
  const start = $("#start");
  if (start) start.disabled = contexts.some(c => c.state === "converting");
}
async function startRun() {
  const btn = $("#start"), err = $("#formErr");
  if (contexts.some(c => c.state === "failed")) { err.textContent = "Remove the failed file first."; return; }
  if (mode === "proof") return startProof(btn, err);
  const models = currentModels();
  if (!models.cModel || !models.xModel) { err.textContent = "Choose a model for both debaters."; return; }
  err.textContent = ""; btn.disabled = true;
  try {
    const run = await api("/api/runs", {
      question: $("#q").value, max_rounds: +$("#rounds").value, first: $("#first").value,
      claude_model: models.cModel, claude_effort: models.cEffort,
      codex_model: models.xModel, codex_effort: models.xEffort,
      subagents: +$("#subs").value, synthesize: $("#synth").checked,
      literature: $("#lit").checked && !$("#lit").disabled,
      contexts: contexts.map(c => ({name: c.name, text: c.text}))});
    store(MODEL_KEY, models);
    contexts = []; draft = null; tab = "progress";
    await refreshState();
    select(run.id);
  } catch (e) { err.textContent = e.message; btn.disabled = false; }
}
async function startProof(btn, err) {
  const w = currentWriter();
  if (!w.model) { err.textContent = "Choose a model for the writer."; return; }
  err.textContent = ""; btn.disabled = true;
  try {
    const run = await api("/api/runs", {
      mode: "proof", question: $("#q").value, writer: w.writer, model: w.model, effort: w.effort,
      contexts: contexts.map(c => ({name: c.name, text: c.text}))});
    store(WRITER_KEY, w);
    contexts = []; draft = null; tab = "markdown";
    await refreshState();
    select(run.id);
  } catch (e) { err.textContent = e.message; btn.disabled = false; }
}

// ---- run detail -----------------------------------------------------------
function renderMarkdown(src) {
  const out = []; let para = [], list = null, code = null, inCp = false;
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/^VERDICT: (AGREE|DISAGREE)$/, (_, v) => `<span class="verdict ${v.toLowerCase()}">VERDICT: ${v}</span>`);
  const flush = () => {
    if (para.length) out.push(`<p${inCp ? ' class="cp"' : ""}>${para.map(inline).join("<br>")}</p>`);
    if (list) out.push(`</${list}>`);
    para = []; list = null;
  };
  for (const line of src.split("\n")) {
    if (code !== null) {
      if (/^```/.test(line)) { out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`); code = null; }
      else code.push(line);
      continue;
    }
    if (/^```/.test(line)) { flush(); code = []; continue; }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      flush();
      const n = Math.min(h[1].length, 4), cls = /^Claude/.test(h[2]) ? "claude" : /^Codex/.test(h[2]) ? "codex" : "";
      out.push(`<h${n} class="${cls}">${inline(h[2])}</h${n}>`); continue;
    }
    if (line.trim() === "CHECKPOINT") { flush(); inCp = true; para.push(line); continue; }
    if (line.trim() === "END CHECKPOINT") { para.push(line); flush(); inCp = false; continue; }
    const li = !inCp && line.match(/^\s*([-*]|\d+\.)\s+(.*)$/);
    if (li) {
      const kind = /\d/.test(li[1]) ? "ol" : "ul";
      if (para.length || (list && list !== kind)) flush();
      if (!list) { out.push(`<${kind}>`); list = kind; }
      out.push(`<li>${inline(li[2])}</li>`); continue;
    }
    if (!line.trim()) { flush(); continue; }
    if (list) flush();
    para.push(line);
  }
  if (code !== null) out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`);
  flush();
  return out.join("\n");
}

let live = null;  // {id, version, nodes: Map, timer}

async function select(id) {
  saveDraft();
  selected = id; clearTimeout(detailTimer);
  if (live) clearTimeout(live.timer);
  history.replaceState(null, "", `${location.search}#run=${id}`);
  document.querySelectorAll(".run-item").forEach(el => el.classList.toggle("sel", el.dataset.id === id));
  $("#main").innerHTML = `
    <div class="stack">
      <div class="card" id="cfg"></div>
      <div class="card">
        <div class="livehead">
          <h3 id="liveTitle">Live</h3><span class="note" id="liveNote"></span>
          <label class="toggle"><input type="checkbox" id="showThinking" ${showThinking ? "checked" : ""}> thinking</label>
          <label class="toggle"><input type="checkbox" id="showTools" ${showTools ? "checked" : ""}> tool calls</label>
        </div>
        <div class="feed ${showThinking ? "" : "no-thinking"} ${showTools ? "" : "no-tools"}" id="feed"><div class="empty" id="feedEmpty">Waiting for the first model output…</div></div>
      </div>
      <div class="card">
        <div class="tabs" style="margin-top:0" id="tabs"></div>
        <div class="pane" id="pane"></div>
      </div>
    </div>`;
  $("#showThinking").onchange = e => { showThinking = e.target.checked; $("#feed").classList.toggle("no-thinking", !showThinking); };
  $("#showTools").onchange = e => { showTools = e.target.checked; $("#feed").classList.toggle("no-tools", !showTools); };
  live = {id, version: 0, nodes: new Map(), timer: null, last: null};
  paneText = null;
  await Promise.all([loadDetail(true), pollLive()]);
}

let paneText = null, showThinking = true, showTools = true;
const TABS = {debate: ["transcript", "progress", "console"], proof: ["markdown", "console"]};
const TAB_LABEL = {transcript: "Final transcript", progress: "Progress", console: "Console", markdown: "Markdown"};
function renderTabs(kind) {
  if (!TABS[kind].includes(tab)) tab = TABS[kind][0];
  $("#tabs").innerHTML = TABS[kind].map(t =>
    `<button data-tab="${t}" class="${t === tab ? "on" : ""}">${TAB_LABEL[t]}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.dataset.tab; paneText = null; loadDetail(true); });
}
function renderConfig(d) {
  const side = (who, model, effort) => `<div class="cfgside ${who.toLowerCase()}"><span>${who}</span>${esc(model || "default")}<em>${esc(effort || "")}</em></div>`;
  $("#liveTitle").textContent = d.kind === "proof" ? "Live work" : "Live debate";
  if (d.kind === "proof") return renderProofConfig(d, side);
  const opts = [`${d.max_rounds} rounds max`, `${d.first === "codex" ? "Codex" : "Claude"} speaks first`,
    d.subagents ? `${d.subagents} sub-agents per side` : "no sub-agents", d.synthesize ? "final synthesis" : "no synthesis"];
  if (d.literature) opts.push("one Evidence API call per side in round 1");
  $("#cfg").innerHTML = `
    <div class="runhead">
      <div style="min-width:0;flex:1">
        <h2>${esc(d.title)}</h2>
        <div class="meta">${statusHtml(d.state)} &nbsp; ${when(d.created)} · ${duration(d)}</div>
      </div>
      <div class="actions" style="margin:0">
        ${d.state === "running" ? `<button class="danger" id="stop" ${d.stop_requested ? "disabled" : ""}>${d.stop_requested ? "Stopping…" : "Stop"}</button>` : ""}
        <button id="reveal" title="${esc(d.path)}">Show files</button>
      </div>
    </div>
    <div class="cfggrid">
      ${side("Claude", d.claude_model, d.claude_effort)}${side("Codex", d.codex_model, d.codex_effort)}
    </div>
    <div class="meta" style="margin-top:8px">${esc(opts.join(" · "))}${d.contexts.length ? ` · context: ${esc(d.contexts.join(", "))}` : ""}</div>
    <details class="question" ${d.question.length < 400 ? "open" : ""}><summary class="note">Question</summary><div class="qtext">${esc(d.question)}</div></details>
    ${d.outcome && d.outcome !== "IN PROGRESS" ? `<div class="outcome o-${d.state}">${esc(d.outcome)}</div>` : ""}
    ${d.agreed_answer ? `<div class="verdict-box"><div class="verdict-label">Agreed answer</div><div class="md">${renderMarkdown(d.agreed_answer)}</div></div>` : ""}
    ${d.state === "failed" ? `<div class="err" style="margin-top:10px">The runner exited with status ${d.exit_code}. See the Console tab.</div>` : ""}`;
  bindRunButtons(d, "Stop this debate? The partial transcript is kept.");
}
function renderProofConfig(d, side) {
  const who = d.writer === "codex" ? "Codex" : "Claude";
  $("#cfg").innerHTML = `
    <div class="runhead">
      <div style="min-width:0;flex:1">
        <h2>${esc(d.title)}</h2>
        <div class="meta">${statusHtml(d.state)} &nbsp; ${when(d.created)} · ${duration(d)} · <span class="kindtag">proof</span></div>
      </div>
      <div class="actions" style="margin:0">
        ${d.state === "running" ? `<button class="danger" id="stop" ${d.stop_requested ? "disabled" : ""}>${d.stop_requested ? "Stopping…" : "Stop"}</button>` : ""}
        <button id="reveal" title="${esc(d.path)}">Show files</button>
      </div>
    </div>
    <div class="cfggrid">${side(who, d.model, d.effort)}</div>
    <div class="meta" style="margin-top:8px">proof-craft: ${esc(d.proof_craft || "")}${d.contexts.length ? ` · context: ${esc(d.contexts.join(", "))}` : ""}</div>
    <details class="question" ${d.question.length < 400 ? "open" : ""}><summary class="note">Statement</summary><div class="qtext">${esc(d.question)}</div></details>
    ${d.proof ? `<div class="verdict-box"><div class="verdict-label" style="display:flex;align-items:center">Proof<button class="copy" id="copyProof">Copy Markdown</button></div><div class="md">${renderMarkdown(d.proof)}</div></div>` : ""}
    ${d.state === "failed" ? `<div class="err" style="margin-top:10px">${esc(d.error || `The proof worker exited with status ${d.exit_code}.`)} See the Console tab.</div>` : ""}`;
  const copy = $("#copyProof");
  if (copy) copy.onclick = async () => {
    try { await navigator.clipboard.writeText(d.proof); copy.textContent = "Copied"; }
    catch (e) { copy.textContent = "Copy failed"; }
    setTimeout(() => { copy.textContent = "Copy Markdown"; }, 1500);
  };
  bindRunButtons(d, "Stop this proof? The model call is cancelled.");
}
function bindRunButtons(d, question) {
  const stop = $("#stop");
  if (stop) stop.onclick = async () => {
    if (!confirm(question)) return;
    stop.disabled = true;
    try { await api(`/api/runs/${d.id}/stop`, {}); } catch (e) { alert(e.message); }
    loadDetail(false);
  };
  $("#reveal").onclick = async () => { const r = await api(`/api/runs/${d.id}/reveal`, {}); if (!/Mac/.test(navigator.platform)) prompt("Run folder:", r.path); };
}
async function loadDetail(fresh) {
  const id = selected; if (!id) return;
  clearTimeout(detailTimer);
  let d;
  try { d = await api(`/api/runs/${id}`); } catch (e) { $("#main").innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  if (id !== selected || !$("#cfg")) return;
  renderConfig(d);
  renderTabs(d.kind);
  const text = {transcript: d.transcript, progress: d.progress, markdown: d.proof, console: d.console}[tab];
  if (text !== paneText || fresh) {
    paneText = text;
    const pane = $("#pane"), old = pane.firstElementChild;
    const stick = !old || old.scrollHeight - old.scrollTop - old.clientHeight < 40;
    const keep = old ? old.scrollTop : 0;
    pane.innerHTML = tab === "transcript"
      ? (text ? `<div class="md scrollbox">${renderMarkdown(text)}</div>`
              : `<div class="empty">The final transcript is written after each completed report.</div>`)
      : `<pre class="log">${esc(text || (tab === "markdown" ? "The proof appears here when the model finishes." : "(nothing yet)"))}</pre>`;
    const box = pane.firstElementChild;
    const follow = tab === "progress" || tab === "console";
    if (box) box.scrollTop = follow && (fresh || stick) ? box.scrollHeight : keep;
  }
  $("#liveNote").textContent = d.state === "running" ? "updating every 2 seconds" : "";
  if (d.state === "running") detailTimer = setTimeout(() => loadDetail(false), 2500);
  else { const listed = runs.find(r => r.id === id); if (listed && listed.state === "running") refreshState(); }
  live.running = d.state === "running";
  $("#feed").classList.toggle("running", live.running);
}

// ---- live feed --------------------------------------------------------------
function clock(ts) { return ts ? ts.slice(11, 19) : ""; }
function entryHtml(e) {
  const who = e.who.toLowerCase();
  if (e.kind === "call")
    return `<div class="callhead ${who}"><span class="whotag">${e.who}</span>${e.model ? `<span class="note">${esc(e.model)}</span>` : ""}<span class="note">${clock(e.ts)}</span></div>`;
  if (e.kind === "text") return `<div class="md">${renderMarkdown(e.text || "")}</div>`;
  if (e.kind === "thinking")
    return `<details class="think" open><summary>thinking</summary><div class="thinktext">${esc(e.text || "")}</div></details>`;
  if (e.kind === "tool")
    return `<details class="tool${e.error ? " bad" : ""}"><summary><span class="toolname">${esc(e.name)}</span> ${esc(e.text || "")}</summary>${e.output ? `<pre>${esc(e.output)}</pre>` : `<div class="note">${e.output === "" ? "(no output)" : "running…"}</div>`}</details>`;
  return `<div class="statusline ${e.ok === false ? "bad" : ""}">${esc(e.text)} <span class="note">${clock(e.ts)}</span></div>`;
}
function upsert(e) {
  const feed = $("#feed");
  let node = live.nodes.get(e.id);
  if (!node) {
    node = document.createElement("div");
    node.dataset.order = `${e.ts}|${String(e.id).padStart(8, "0")}`;
    let after = null;
    for (const other of feed.children) if (other.dataset.order && other.dataset.order > node.dataset.order) { after = other; break; }
    feed.insertBefore(node, after);
    live.nodes.set(e.id, node);
  }
  node.className = `entry k-${e.kind} w-${e.who.toLowerCase()}`;
  // Keep each <details> open/closed as the reader left it.
  const det = node.querySelector("details");
  const wasOpen = det ? det.open : null;
  node.innerHTML = entryHtml(e);
  const now = node.querySelector("details");
  if (now && wasOpen !== null) now.open = wasOpen;
}
async function pollLive() {
  const state = live; if (!state || state.id !== selected) return;
  let res;
  try { res = await api(`/api/runs/${state.id}/live?since=${state.version}`); } catch (e) { res = null; }
  if (live !== state || !$("#feed")) return;
  if (res && res.entries.length) {
    const feed = $("#feed");
    const stick = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 60;
    const empty = $("#feedEmpty"); if (empty) empty.remove();
    res.entries.forEach(upsert);
    state.version = res.version;
    if (stick || state.first !== false) feed.scrollTop = feed.scrollHeight;
    state.first = false;
  }
  if (state.running !== false || (res && res.entries.length)) state.timer = setTimeout(pollLive, 1500);
  else if (!state.nodes.size) $("#feedEmpty") && ($("#feedEmpty").textContent = "No model output was recorded for this run.");
}

$("#newBtn").onclick = showForm;
refreshState();
setInterval(refreshState, 5000);
const linked = location.hash.match(/^#run=([0-9a-f-]+)$/);
if (linked) select(linked[1]); else showForm();
</script>
